apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authorizer-service-dev
  namespace: argocd
  # (opsional) image-updater — aktifkan bila bagian 8.4 dipasang
  # annotations:
  #   argocd-image-updater.argoproj.io/image-list: app=docker.io/mafzaidi93/authorizer
  #   argocd-image-updater.argoproj.io/app.update-strategy: semver
  #   argocd-image-updater.argoproj.io/app.helm.image-name: image.repository
  #   argocd-image-updater.argoproj.io/app.helm.image-tag: image.tag
  #   argocd-image-updater.argoproj.io/write-back-method: git
  #   argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/zencodecode/kubernetes-manifest.git
    targetRevision: main
    path: apps/authorizer-service
    helm:
      valueFiles:
        - values.yaml
        - values.dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: authorizer-service-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true