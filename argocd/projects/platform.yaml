# Project for cluster add-ons (ingress controller, cert-manager, DNS tweaks).
# These install CRDs, webhooks and cluster roles, so cluster-scoped resources
# are allowed, but only into the add-on namespaces below.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    # Projects must exist before the Applications that reference them.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Cluster add-ons managed by the platform layer
  sourceRepos:
    - https://github.com/zencodecode/kubernetes-manifest.git
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: ingress-nginx
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    # cert-manager keeps its leader-election Role in kube-system; coredns-custom lives there.
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
