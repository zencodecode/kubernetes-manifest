# Project for in-house application workloads (generated by argocd/appsets/apps.yaml).
# Least privilege: one source repo, namespaces named <app>-<env>, and only the
# namespace-scoped kinds that charts/app and the KSOPS secrets render.
# An app that needs another kind (StatefulSet, PVC, Role, ...) must be added here
# on purpose, which makes the change visible in review.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
  annotations:
    # Projects must exist before the Applications that reference them.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: In-house application workloads
  sourceRepos:
    - https://github.com/zencodecode/kubernetes-manifest.git
  destinations:
    # Add a pattern per environment, e.g. '*-prod', when that env is introduced.
    - server: '*'
      namespace: '*-dev'
  # CreateNamespace=true in the generated Applications creates the namespace.
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - { group: '', kind: ConfigMap }
    - { group: '', kind: Secret }
    - { group: '', kind: Service }
    - { group: '', kind: ServiceAccount }
    - { group: apps, kind: Deployment }
    - { group: batch, kind: Job }
    - { group: batch, kind: CronJob }
    - { group: autoscaling, kind: HorizontalPodAutoscaler }
    - { group: policy, kind: PodDisruptionBudget }
    - { group: networking.k8s.io, kind: Ingress }
    - { group: networking.k8s.io, kind: NetworkPolicy }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute }
  # Show resources in app namespaces that are not in Git.
  orphanedResources:
    warn: true
