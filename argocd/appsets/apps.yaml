# One Argo CD Application per app environment, discovered from
#   apps/<app>/envs/<env>/config.yaml
# Generated Application: <app>-<env>, project "apps". Its sources:
#   1. the chart (default charts/app) rendered with
#        apps/<app>/values.yaml + apps/<app>/envs/<env>/values.yaml
#   2. this repo as the `$values` ref used by the value files above
#   3. secrets/<app>/<env> (Kustomize + KSOPS), skipped when secrets.enabled: false
# Chart, values and Secret sync together in one Application, ordered by sync waves.
#
# config.yaml keys (do not add a top-level `path` key, the generator reserves it):
#   chart.path            required, e.g. charts/app
#   chart.repoURL         optional, default this repo
#   chart.targetRevision  optional, default main (pin a git tag in prod to
#                         promote chart changes env by env)
#   destination.server    required (the cluster for this env)
#   destination.namespace required, <app>-<env>
#   secrets.enabled       optional, default true
#   sync.automated        optional, default false (manual sync)
#
# Image Updater (git write-back) — add these keys to enable automatic image
# tag updates committed back to this repository:
#   imageUpdater.image       required, e.g. mafzaidi93/authorizer-service
#   imageUpdater.strategy    optional, default "latest" (semver | latest | digest)
#   imageUpdater.constraint  optional, version constraint (e.g. "~0.0" for semver)
# When imageUpdater is present the ApplicationSet adds the annotations that
# argocd-image-updater reads. The updater commits the new tag into
# apps/<app>/envs/<env>/values.yaml (via .argocd-source-<appName>.yaml override).
#
# Every env referenced here must have environments/<env>/values.yaml (env-wide
# Helm values such as global.domain / global.ingressClassName / global.tls).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/zencodecode/kubernetes-manifest.git
        revision: main
        files:
          - path: apps/*/envs/*/config.yaml
  template:
    metadata:
      name: '{{ index .path.segments 1 }}-{{ .path.basename }}'
      labels:
        app.kubernetes.io/part-of: '{{ index .path.segments 1 }}'
        environment: '{{ .path.basename }}'
      # Removing an env folder from Git deletes that env's resources too.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: apps
      destination:
        server: '{{ .destination.server }}'
        namespace: '{{ .destination.namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - PrunePropagationPolicy=foreground
        # Enforce the "restricted" Pod Security Standard on app namespaces.
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/warn: restricted
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
  templatePatch: |
    metadata:
      {{- if hasKey . "imageUpdater" }}
      annotations:
        argocd-image-updater.argoproj.io/image-list: app={{ .imageUpdater.image }}
        argocd-image-updater.argoproj.io/app.update-strategy: {{ dig "strategy" "newest-build" .imageUpdater }}
        {{- with dig "constraint" "" .imageUpdater }}
        argocd-image-updater.argoproj.io/app.version-constraint: {{ . }}
        {{- end }}
        argocd-image-updater.argoproj.io/app.helm.image-name: image.repository
        argocd-image-updater.argoproj.io/app.helm.image-tag: image.tag
        argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
        argocd-image-updater.argoproj.io/write-back-target: "helmvalues:../../{{ .path.path }}/values.yaml"
        argocd-image-updater.argoproj.io/git-branch: main
      {{- end }}
    spec:
      sources:
        - repoURL: {{ dig "chart" "repoURL" "https://github.com/zencodecode/kubernetes-manifest.git" . }}
          targetRevision: {{ dig "chart" "targetRevision" "main" . }}
          path: {{ .chart.path }}
          helm:
            releaseName: {{ index .path.segments 1 }}
            valueFiles:
              # Lowest priority first: env-wide (domain/ingress/TLS) -> app base -> app/env.
              - $values/environments/{{ .path.basename }}/values.yaml
              - $values/apps/{{ index .path.segments 1 }}/values.yaml
              - $values/{{ .path.path }}/values.yaml
        - repoURL: https://github.com/zencodecode/kubernetes-manifest.git
          targetRevision: main
          ref: values
        {{- if dig "secrets" "enabled" true . }}
        - repoURL: https://github.com/zencodecode/kubernetes-manifest.git
          targetRevision: main
          path: secrets/{{ index .path.segments 1 }}/{{ .path.basename }}
        {{- end }}
      {{- if dig "sync" "automated" false . }}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
      {{- end }}
