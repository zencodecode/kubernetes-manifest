apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Synced in the same Argo CD Application as the chart. Wave -3 creates the Secret
# before the migrate/seed hooks (waves -2/-1) and the workloads (wave 0).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "-3"
generators:
  - secret-generator.yaml
