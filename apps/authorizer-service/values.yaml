# authorizer-service: values shared by every environment.
# Rendered with the generic chart in charts/app. Per-env overrides live in
# envs/<env>/values.yaml and are merged on top of this file.
#
# One image, several roles. The api binary (/app/authorizer) picks its role
# from the INTERFACE env var, one role per process:
#   HTTP_PUBLIC  -> OAuth/OIDC HTTP server, exposes /health and /ready
#   EVENT        -> RabbitMQ consumer (email), no HTTP port
#   HTTP_PRIVATE -> admin API (handler still commented out in cmd/api/main.go)
# The image also ships /app/seed and the golang-migrate CLI + /app/migrations.

image:
  repository: docker.io/mafzaidi93/authorizer-service
  tag: ""   # pinned per environment in envs/<env>/values.yaml

# Runtime secrets (Postgres, Redis, RabbitMQ, SMTP, JWT, OAuth, SEED_*). Created
# from secrets/authorizer-service/<env>/ by KSOPS in the same Argo CD Application.
secretRefs:
  - authorizer-service-secret

# Non-secret settings shared by every env. The app treats any ENVIRONMENT other
# than "production" as non-prod; "production" (the app default) turns on HTTPS
# redirects and requires CORS to be set.
config: {}

networkPolicy:
  enabled: true

workloads:
  public:
    command: ["/app/authorizer"]
    env:
      - name: INTERFACE
        value: HTTP_PUBLIC
      # Must match ports[http].containerPort.
      - name: HTTP_PUBLIC_PORT
        value: "8181"
    ports:
      - name: http
        containerPort: 8181
    probes:
      # /health is always 200 once the server is up (liveness, no dependency checks).
      startup:
        httpGet: { path: /health, port: http }
        periodSeconds: 2
        failureThreshold: 30
      liveness:
        httpGet: { path: /health, port: http }
        periodSeconds: 10
        failureThreshold: 3
      # /ready pings Postgres and Redis; pod leaves the load balancer when they fail.
      readiness:
        httpGet: { path: /ready, port: http }
        periodSeconds: 5
        failureThreshold: 3
    # Give the ingress controller time to drop the pod from its endpoints before
    # the app gets SIGTERM (the app then drains for up to 15s).
    lifecycle:
      preStop:
        sleep:
          seconds: 5
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 256Mi }
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
    ingress:
      enabled: false   # host is set per environment

  event:
    command: ["/app/authorizer"]
    env:
      - name: INTERFACE
        value: EVENT
    # Competing consumers on the same queue; 2 replicas keep email delivery
    # running while one pod restarts or its node is drained.
    replicas: 2
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 192Mi }

  # Admin API. Enable once HTTP_PRIVATE is implemented in the app; until then the
  # process exits right away and the pod would crash-loop. Keep it internal: no
  # ingress, and the NetworkPolicy only admits pods from the same namespace.
  # Add probes here once the private server exposes a health endpoint.
  private:
    enabled: false
    command: ["/app/authorizer"]
    env:
      - name: INTERFACE
        value: HTTP_PRIVATE
      - name: HTTP_PRIVATE_PORT
        value: "8080"
    ports:
      - name: http
        containerPort: 8080

# Argo CD Sync hooks. They run on every sync, after the Secret/ConfigMap
# (wave -3) and before the workloads (wave 0). Both commands are idempotent.
jobs:
  migrate:
    hook: Sync
    wave: -2
    command: ["migrate"]
    # Kubernetes expands $(VAR) from the container env (the Secret above).
    # The password is not put in the URL: the postgres driver (lib/pq) reads
    # PGPASSWORD, so any character works and it stays out of the process args.
    env:
      - name: PGPASSWORD
        valueFrom:
          secretKeyRef:
            name: authorizer-service-secret
            key: POSTGRES_PASSWORD
    args:
      - -path=/app/migrations
      - -database=postgres://$(POSTGRES_USER)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DATABASE)?sslmode=$(POSTGRES_SSLMODE)
      - up
    backoffLimit: 3
    activeDeadlineSeconds: 300
  seed:
    hook: Sync
    wave: -1
    command: ["/app/seed"]
    backoffLimit: 3
    activeDeadlineSeconds: 300
