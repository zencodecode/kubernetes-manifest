# Default values for authorizer-service.
# Shared across all environments. Per-env overrides go in values.<env>.yaml.

replicaCount: 1

image:
  repository: docker.io/mafzaidi93/authorizer-service
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000

# Main service (used by ingress)
service:
  type: ClusterIP
  port: 8080

# Public API
publicApi:
  port: 8080
  containerPort: 8080
  service:
    type: ClusterIP
  ingress:
    enabled: false
    className: "nginx"
    annotations: {}
    hosts: []
    tls: []

# Private API (internal gRPC / inter-service)
privateApi:
  port: 9090
  containerPort: 9090
  service:
    type: ClusterIP
  networkPolicy:
    enabled: false
  tls: []

# Ingress (legacy/single-port — prefer publicApi.ingress)
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts: []
  tls: []

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 2

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
  # targetMemoryUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

envFrom: []
env: []

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: authorizer-service
