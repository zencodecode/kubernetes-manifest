# ingress-nginx / dev (k3d). Reaches the controller through the k3d load balancer
# via NodePort + hostPort. In cloud, replace this with:
#   controller:
#     service: { type: LoadBalancer }   # + provider annotations
#     replicaCount: 2
#     autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 5 }
#     podDisruptionBudget: { enabled: true, minAvailable: 1 }
controller:
  hostPort:
    enabled: true
  service:
    type: NodePort
    nodePorts:
      http: 30080
      https: 30443
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
