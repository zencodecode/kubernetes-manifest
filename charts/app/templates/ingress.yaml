{{- range $name, $w := .Values.workloads }}
{{- $ing := $w.ingress | default dict }}
{{- if and (include "app.isEnabled" $w) $w.ports $ing.enabled }}
{{- $ctx := dict "root" $ "component" $name }}
{{- $defaultPort := (first $w.ports).name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.componentName" $ctx }}
  labels:
    {{- include "app.labels" $ctx | nindent 4 }}
  {{- with $ing.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ing.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ing.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range (required (printf "workloads.%s.ingress.hosts is required" $name) $ing.hosts) }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range (.paths | default (list (dict "path" "/"))) }}
          - path: {{ .path | default "/" }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "app.componentName" $ctx }}
                port:
                  name: {{ .port | default $defaultPort }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
