apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: dev-cluster
servers: 1
agents: 2
image: rancher/k3s:v1.31.4-k3s1
options:
  k3d: { wait: true, timeout: "120s" }
  k3s:
    extraArgs:
      - { arg: --disable=traefik,   nodeFilters: [server:*] }
      - { arg: --disable=servicelb, nodeFilters: [server:*] }   # hindari rebutan 80/443
  kubeconfig: { updateDefaultKubeconfig: true, switchCurrentContext: true }
ports:
  - { port: 80:80,   nodeFilters: [loadbalancer] }
  - { port: 443:443, nodeFilters: [loadbalancer] }
registries:
  create: { name: dev-registry, hostPort: "5000" }