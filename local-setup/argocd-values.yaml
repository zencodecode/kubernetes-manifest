global:
  resources:
    requests: { cpu: 25m, memory: 64Mi }

dex: { enabled: false }
notifications: { enabled: false }
applicationSet: { enabled: true }

controller:
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }

server:
  extraArgs: ["--insecure"]
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }

redis:
  resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { memory: 128Mi } }

repoServer:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret: { secretName: sops-age }
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.3.3
      command: ["/bin/sh", "-c"]
      args:
        - >
          echo "Installing KSOPS...";
          mv ksops /custom-tools/;
          mv "$(which kustomize)" /custom-tools/;
      volumeMounts:
        - { name: custom-tools, mountPath: /custom-tools }
  volumeMounts:
    - { name: custom-tools, mountPath: /usr/local/bin/kustomize, subPath: kustomize }
    - { name: custom-tools, mountPath: /usr/local/bin/ksops,     subPath: ksops }
    - { name: sops-age,     mountPath: /home/argocd/.config/sops/age }
  env:
    - { name: SOPS_AGE_KEY_FILE,    value: /home/argocd/.config/sops/age/keys.txt }
    - { name: KUSTOMIZE_PLUGIN_HOME, value: /home/argocd/.config/kustomize/plugin }

configs:
  cm:
    kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
  params:
    server.insecure: true