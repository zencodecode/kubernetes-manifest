services:
  postgres:
    image: postgres:16
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgresdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: devdb
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: 512M } } }

  redis:
    image: redis:7
    container_name: redis-dev
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s }
    deploy: { resources: { limits: { memory: 256M } } }

  mongodb:
    image: mongo:7
    container_name: mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongodb
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: devdb
    ports: ["27017:27017"]
    volumes: ["mongodb-data:/data/db"]
    healthcheck: { test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"], interval: 10s }
    deploy: { resources: { limits: { memory: 512M } } }

volumes: { postgres-data: , redis-data: , mongodb-data: }